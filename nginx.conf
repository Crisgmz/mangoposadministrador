# ============================================================================
# nginx config para servir el Flutter web build (SPA con go_router).
#
# Reglas clave:
#  - Fallback a /index.html para todas las rutas (client-side routing).
#  - index.html / service worker / manifest sin cache para que los usuarios
#    siempre carguen la última versión.
#  - Resto de assets con cache largo + revalidación por ETag.
# ============================================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Tamaño máx de body: subimos un poco por si en el futuro se hace upload.
  client_max_body_size 10M;

  # Gzip — Flutter web es pesado (main.dart.js suele ser MB), comprimir ayuda.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # Security headers — defensivo, no rompe nada.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Permissions-Policy: deshabilitar features que la app no usa.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # --------------------------------------------------------------------------
  # Archivos que NO se cachean — siempre se revalidan contra el server.
  # index.html arrastra los hashes del bundle; cachearlo dejaría a usuarios
  # con builds viejos. flutter_service_worker.js controla el cache de assets.
  # --------------------------------------------------------------------------
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # --------------------------------------------------------------------------
  # CanvasKit y assets de Flutter — contenido inmutable, cache agresivo.
  # --------------------------------------------------------------------------
  location /canvaskit/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # --------------------------------------------------------------------------
  # Resto: SPA fallback. go_router maneja /negocios, /cajas, /mesas, etc.
  # --------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Errores → también caen al index para que GoRouter muestre su 404.
  error_page 404 /index.html;
}
